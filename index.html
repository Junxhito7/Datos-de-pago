<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Transferencia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 360px;
            width: 100%;
        }

        h2 {
            color: #1a252c;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .campo {
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #0066cc;
        }

        .etiqueta {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .valor {
            font-size: 16px;
            color: #111;
            font-weight: 600;
            margin-top: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="text-align: center; color: #0066cc; margin-bottom: 5px; font-size: 16px;">Huaraches de Juan</h3>
        <h2>Datos para Transferencia</h2>

        <div class="campo">
            <div class="etiqueta">Titular</div>
            <div class="valor">Eva Isabel Carretero Sandoval</div>
        </div>

        <div class="campo">
            <div class="etiqueta">Banco</div>
            <div class="valor">Santander</div>
        </div>

        <div class="campo">
            <div class="etiqueta">CLABE Interbancaria</div>
            <div class="valor">01-44-27-56-93-97-76-14-18</div>
        </div>
    </div>

</body>
</html>
